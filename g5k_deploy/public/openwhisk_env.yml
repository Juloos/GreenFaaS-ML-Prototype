---
name: openwhisk_kube_x86_64
version: 1
arch: x86_64
alias: ubuntu2004-x86_64-min-openwhisk-kube
description: ubuntu 20.04 for x86_64 - min - openwhisk-ready installation
author: sejules
visibility: public
destructive: true
os: linux
image:
  file: http://public/~$KADEPLOY_USER/openwhisk_kube_x86_64.tar.zst
  kind: tar
  compression: zstd
postinstalls:
- archive: http://public/~$KADEPLOY_USER/g5k-postinstall-unipart.tgz
  compression: gzip
  script: g5k-postinstall --net netplan --disk-aliases --fstab custom
boot:
  kernel: "/boot/vmlinuz"
  initrd: "/boot/initrd.img"
  kernel_params: modprobe.blacklist=nouveau
filesystem: ext4
partition_type: 131
multipart: false
