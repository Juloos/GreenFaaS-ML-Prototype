---
name: docker_swift_x86_64
version: 1
arch: x86_64
alias: ubuntu2404-x86_64-min-docker-swift
description: ubuntu 24.04 for x86_64 - min - swift-ready installation
author: sejules
visibility: public
destructive: true
os: linux
image:
  file: http://public/~{{USER}}/docker_swift_x86_64.tar.zst
  kind: tar
  compression: zstd
postinstalls:
- archive: server:///grid5000/postinstalls/g5k-postinstall.tgz
  compression: gzip
  script: g5k-postinstall --net netplan --disk-aliases
boot:
  kernel: "/boot/vmlinuz"
  initrd: "/boot/initrd.img"
  kernel_params: modprobe.blacklist=nouveau
filesystem: ext4
partition_type: 131
multipart: false
